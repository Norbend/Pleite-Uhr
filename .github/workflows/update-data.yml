name: Daten aktualisieren

on:
  schedule:
    - cron: "17 6 * * *"   # täglich 06:17 UTC; committet nur bei neuen Daten
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_data.py
      - name: Commit bei Änderungen
        run: |
          # fetch_data.py schreibt nur, wenn sich amtliche Werte geändert haben
          if git diff --quiet data/; then echo "keine neuen Daten"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Daten: neuer amtlicher Stand"
          git push
